<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청량리역 요진 와이시티 - 호수별 옵션 계약 현황</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root" data-palette="#0ca30c,#2a78d6,#898781">

  <div class="navbar">
    <a class="home" href="index.html">← 처음으로</a>
    <a class="home" href="electric.html">⚡ 전기공사 옵션</a>
    <span class="spacer"></span>
    <button type="button" class="srv" id="srvChip">서버 확인 중…</button>
    <button type="button" class="srv" id="editChip" hidden>✏️ 수정하기</button>
  </div>

  <div class="sysbar" id="sysBar" hidden></div>

  <header class="hero">
    <div class="hero-top">
      <div class="hero-title">
        <h1>호수별 옵션 계약 현황</h1>
        <p class="subtitle">청량리역 요진 와이시티 · 골구도 기준 · 2026-07-07 데이터 · 정리일 2026-08-19</p>
      </div>
      <div class="hero-stats">
        <div class="hs"><span class="hs-label">전체</span><span class="hs-num" id="statTotal">-</span></div>
        <div class="hs good"><span class="hs-label">옵션 계약</span><span class="hs-num" id="statOption">-</span></div>
        <div class="hs info"><span class="hs-label">계약완료 · 옵션無</span><span class="hs-num" id="statNooption">-</span></div>
        <div class="hs"><span class="hs-label">미계약</span><span class="hs-num" id="statNone">-</span></div>
      </div>
    </div>
    <div class="prop-wrap">
      <div class="prop"><i class="good" id="propGood"></i><i class="info" id="propInfo"></i><i class="none" id="propNone"></i></div>
      <div class="prop-legend">
        <span><i class="dot good"></i>옵션 계약 <b id="propGoodTxt">-</b></span>
        <span><i class="dot info"></i>계약완료 · 옵션無 <b id="propInfoTxt">-</b></span>
        <span><i class="dot none"></i>미계약 <b id="propNoneTxt">-</b></span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <label class="tb-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchBox" placeholder="호수로 검색 (예: 1902, 501)">
    </label>
    <div class="seg">
      <button class="filter-btn" data-filter="all" aria-pressed="true" type="button">전체</button>
      <button class="filter-btn" data-filter="option" aria-pressed="false" type="button">옵션 계약만</button>
      <button class="filter-btn" data-filter="nooption" aria-pressed="false" type="button">계약완료·옵션無</button>
      <button class="filter-btn" data-filter="none" aria-pressed="false" type="button">미계약만</button>
    </div>
  </div>

  <div class="legend">
    <span class="chip"><span class="swatch" style="background:var(--good-bg); border:1px solid var(--good)"></span>옵션 계약</span>
    <span class="chip"><span class="swatch" style="background:var(--info-bg); border:1px solid var(--info)"></span>계약완료 · 옵션 미선택</span>
    <span class="chip"><span class="swatch" style="background:var(--neutral-bg); border:1px solid var(--border)"></span>미계약</span>
    <span class="chip">호수를 클릭하면 상세 정보가 열려요</span>
  </div>

  <div class="option-panel panel-collapsible" id="optionPanel">
    <div class="option-panel-head">
      <button type="button" class="opt-toggle" id="optToggle" aria-expanded="true" aria-controls="optionPanelBody">
        <span class="opt-caret" aria-hidden="true"></span>옵션 항목별로 보기
      </button>
      <span class="opt-sel-badge" id="optSelBadge" hidden></span>
      <span class="option-panel-hint" id="optionActiveHint"></span>
      <span class="spacer"></span>
      <button type="button" class="opt-clear" id="optClearBtn" hidden>선택 해제</button>
      <button type="button" id="pdfBtn" class="pdf-btn" disabled title="먼저 옵션 항목을 선택해주세요">📄 PDF로 출력</button>
    </div>
    <div class="option-panel-body" id="optionPanelBody">
      <div class="option-chip-row" id="optionChipRow"></div>
      <p class="opt-multi-tip">항목을 여러 개 누르면 <b>모두 계약한 세대</b>만 강조됩니다.</p>
    </div>
  </div>

  <!-- 인쇄(PDF) 전용 머리말 — 화면에는 보이지 않습니다 -->
  <div class="print-only" id="printHead">
    <h2 id="printTitle"></h2>
    <p id="printMeta"></p>
    <div id="printList"></div>
  </div>

  <div class="buildings">
    <div class="building">
      <h2>101동</h2>
      <div id="grid101"></div>
    </div>
    <div class="building">
      <h2>102동</h2>
      <div id="grid102"></div>
    </div>
  </div>

  <div class="made-by">제작 이정안 사원 · 수정 문의 <a href="tel:01080306615">010-8030-6615</a></div>

  <div class="backdrop" id="backdrop">
    <div class="modal modal-wrap" id="modal" role="dialog" aria-modal="true">
      <button class="close-btn" id="closeBtn" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="backdrop" id="pinBackdrop" style="z-index:80;">
    <div class="modal modal-wrap" style="max-width:400px;">
      <button class="close-btn" id="pinClose" aria-label="닫기">✕</button>
      <div id="pinBody"></div>
    </div>
  </div>

  <div class="lightbox-backdrop" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="닫기">✕</button>
    <img id="lightboxImg" src="" alt="평면도 크게보기">
  </div>

</div>

<script src="settings.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="plans.js"></script>
<script src="editui.js"></script>
<script>
(function () {
  'use strict';
  var D = window.WYC, S = window.WYCStore, P = window.WYCPlans, U = window.WYCEdit;
  var UNITS = D.units;
  var OPTION_ITEMS = D.optionItems;
  var KIND = '계약';
  var STATE_LABEL = { option: '옵션 계약', nooption: '계약완료 · 옵션 미선택', none: '미계약' };

  var allUnits = Object.keys(UNITS).map(function (k) { return UNITS[k]; });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  /* ---------- 원본 + 수정내역을 합친 "지금 값" ---------- */
  function nowOf(u) {
    var c = S.get(KIND, u.dong + u.ho);
    return {
      state: (c && c.state) ? c.state : u.state,
      opts: (c && c.opts) ? c.opts.slice() : (u.opts || []).slice()
    };
  }
  function isEdited(u) { return S.edited(KIND, u.dong + u.ho); }

  /* ---------- 통계 ---------- */
  function paintStats() {
    var n = { option: 0, nooption: 0, none: 0 };
    allUnits.forEach(function (u) { n[nowOf(u).state]++; });
    var total = allUnits.length;
    document.getElementById('statTotal').textContent = total + '세대';
    document.getElementById('statOption').textContent = n.option + '세대';
    document.getElementById('statNooption').textContent = n.nooption + '세대';
    document.getElementById('statNone').textContent = n.none + '세대';

    function pct(v) { return total ? (v / total * 100) : 0; }
    document.getElementById('propGood').style.width = pct(n.option) + '%';
    document.getElementById('propInfo').style.width = pct(n.nooption) + '%';
    document.getElementById('propNone').style.width = pct(n.none) + '%';
    document.getElementById('propGoodTxt').textContent = n.option + '세대 (' + Math.round(pct(n.option)) + '%)';
    document.getElementById('propInfoTxt').textContent = n.nooption + '세대';
    document.getElementById('propNoneTxt').textContent = n.none + '세대';
  }

  /* ---------- 옵션 칩 (여러 개 선택 가능) ---------- */
  function optionCount(name) {
    var n = 0;
    allUnits.forEach(function (u) { if (nowOf(u).opts.indexOf(name) >= 0) n++; });
    return n;
  }

  /* 지금 선택된 항목들에 name 을 더했을 때 몇 세대가 남는지 (칩이 "선택해도 소용없음"인지 표시용) */
  function comboCount(name) {
    var sel = view.activeOptions;
    var n = 0;
    allUnits.forEach(function (u) {
      var opts = nowOf(u).opts;
      for (var i = 0; i < sel.length; i++) { if (sel[i] !== name && opts.indexOf(sel[i]) < 0) return; }
      if (opts.indexOf(name) >= 0) n++;
    });
    return n;
  }

  function refreshChipStates() {
    var sel = view.activeOptions;
    document.querySelectorAll('.option-chip').forEach(function (c) {
      var nm = c.dataset.option;
      var on = sel.indexOf(nm) >= 0;
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.classList.toggle('is-empty', !on && sel.length > 0 && comboCount(nm) === 0);
    });
  }

  function updateOptionHead(shownHits) {
    var sel = view.activeOptions;
    var hintEl = document.getElementById('optionActiveHint');
    var badgeEl = document.getElementById('optSelBadge');
    var clearBtn = document.getElementById('optClearBtn');
    if (!sel.length) {
      hintEl.textContent = '';
      badgeEl.hidden = true;
      clearBtn.hidden = true;
      pdfBtn.disabled = true;
      pdfBtn.title = '먼저 옵션 항목을 선택해주세요';
      return;
    }
    badgeEl.hidden = false;
    badgeEl.textContent = sel.length + '개 선택';
    clearBtn.hidden = false;
    var label = '"' + sel.join('" + "') + '"';
    hintEl.textContent = (sel.length === 1 ? (label + ' 있는 세대 ') : (label + ' 모두 있는 세대 ')) + shownHits + '곳';
    pdfBtn.disabled = false;
    pdfBtn.title = label + ' 골구도를 PDF로 출력';
  }

  function paintChips() {
    var row = document.getElementById('optionChipRow');
    row.innerHTML = OPTION_ITEMS.map(function (nm) {
      return '<button type="button" class="option-chip" data-option="' + esc(nm) + '" aria-pressed="' +
             (view.activeOptions.indexOf(nm) >= 0) + '">' + esc(nm) +
             ' <span class="cnt">' + optionCount(nm) + '</span></button>';
    }).join('');
    row.querySelectorAll('.option-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var name = chip.dataset.option;
        var i = view.activeOptions.indexOf(name);
        if (i >= 0) view.activeOptions.splice(i, 1); else view.activeOptions.push(name);
        refreshChipStates();
        applyView();
      });
    });
    refreshChipStates();
  }

  document.getElementById('optClearBtn').addEventListener('click', function () {
    view.activeOptions = [];
    refreshChipStates();
    applyView();
  });

  /* ---------- 옵션 패널 접기/펼치기 ---------- */
  (function () {
    var panel = document.getElementById('optionPanel');
    var toggle = document.getElementById('optToggle');
    function setOpen(open) {
      panel.classList.toggle('collapsed', !open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      try { localStorage.setItem('wyc_contract_optpanel', open ? '1' : '0'); } catch (e) {}
    }
    toggle.addEventListener('click', function () { setOpen(panel.classList.contains('collapsed')); });
    var saved = null;
    try { saved = localStorage.getItem('wyc_contract_optpanel'); } catch (e) {}
    setOpen(saved !== '0');
  })();

  /* ---------- 골구도 ---------- */
  function buildGrid(containerId, dong) {
    var host = document.getElementById(containerId);
    host.innerHTML = '';
    D.grid.forEach(function (fl) {
      var row = document.createElement('div');
      row.className = 'floor-row';
      var lbl = document.createElement('div');
      lbl.className = 'floor-label';
      lbl.textContent = fl.floor;
      row.appendChild(lbl);

      var byPos = {};
      fl.positions.filter(function (p) { return p.dong === dong; })
                  .forEach(function (p) { byPos[p.pos] = p; });

      for (var pos = 1; pos <= 5; pos++) {
        var p = byPos[pos];
        var cell = document.createElement('div');
        var u = (p && p.key) ? UNITS[p.key] : null;
        if (!u) { cell.className = 'unit-cell empty'; row.appendChild(cell); continue; }
        cell.dataset.key = p.key;
        cell.dataset.label = u.label;
        cell.tabIndex = 0;
        paintCell(cell, u);
        cell.addEventListener('click', function (e) { openModal(e.currentTarget.dataset.key); });
        cell.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(e.currentTarget.dataset.key); }
        });
        row.appendChild(cell);
      }
      host.appendChild(row);
    });
  }

  function paintCell(cell, u) {
    var st = nowOf(u).state;
    cell.className = 'unit-cell state-' + st + (isEdited(u) ? ' is-edited' : '');
    cell.dataset.state = st;
    cell.innerHTML = '<span class="ho">' + u.label + '</span><span class="ty">' + esc(u.type || '') + '</span>';
  }

  function repaintAll() {
    Object.keys(UNITS).forEach(function (k) {
      var cell = document.querySelector('.unit-cell[data-key="' + k + '"]');
      if (cell) paintCell(cell, UNITS[k]);
    });
    paintStats();
    paintChips();
    applyView();
  }

  /* ---------- 보기 상태 ---------- */
  var view = { query: '', stateFilter: 'all', activeOptions: [] };
  var pdfBtn = document.getElementById('pdfBtn');

  function applyView() {
    var sel = view.activeOptions;
    var shownHits = 0;
    document.querySelectorAll('.unit-cell:not(.empty)').forEach(function (c) {
      var u = UNITS[c.dataset.key];
      if (!u) return;
      var cur = nowOf(u);
      var pass = (view.stateFilter === 'all' || cur.state === view.stateFilter);
      c.style.display = pass ? '' : 'none';
      if (!pass) { c.classList.remove('dim', 'opt-hit'); return; }

      var hit = false, dim = false;
      if (sel.length) {
        hit = sel.every(function (nm) { return cur.opts.indexOf(nm) >= 0; });
        dim = !hit;
        if (hit) shownHits++;
      }
      if (!dim && view.query) dim = c.dataset.label.indexOf(view.query) < 0;
      c.classList.toggle('opt-hit', hit);
      c.classList.toggle('dim', dim);
    });
    updateOptionHead(shownHits);
  }

  document.getElementById('searchBox').addEventListener('input', function (e) {
    view.query = e.target.value.trim();
    applyView();
  });
  document.querySelectorAll('.filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-btn').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
      view.stateFilter = btn.dataset.filter;
      applyView();
    });
  });

  /* ---------- 세대 상세 ---------- */
  var backdrop = document.getElementById('backdrop');
  var modalBody = document.getElementById('modalBody');
  var curKey = null, curTab = 'info';

  function openModal(key) {
    if (!UNITS[key]) return;
    curKey = key;
    curTab = 'info';
    renderModal();
    backdrop.classList.add('open');
  }

  function tab(id, label, n) {
    return '<button type="button" class="mtab" data-tab="' + id + '" aria-pressed="' +
           (curTab === id) + '">' + label + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }

  function renderModal() {
    var u = UNITS[curKey];
    if (!u) return;
    var cur = nowOf(u);
    var ed = S.info(KIND, u.dong + u.ho);

    var html = '<h3>' + u.dong + '동 ' + u.label + '</h3>' +
      '<p class="sub">' + u.floor + ' · TYPE ' + esc(u.type || '-') + ' · ' + esc(u.gubun || '-') + '</p>' +
      '<span class="badge state-' + cur.state + '">' + STATE_LABEL[cur.state] + '</span>' +
      '<div class="mtabs">' +
        tab('info', '옵션', cur.opts.length) +
        tab('plan', '평면도', null) +
        (S.unlocked() ? tab('edit', '수정', null) : '') +
      '</div><div id="mtabBody"></div>';

    modalBody.innerHTML = html;
    modalBody.querySelectorAll('.mtab').forEach(function (b) {
      b.addEventListener('click', function () { curTab = b.dataset.tab; renderModal(); });
    });

    var host = document.getElementById('mtabBody');
    if (curTab === 'info') {
      var h = '<div class="info-grid">' +
        '<div><span class="k">공급계약일</span><span class="v">' + esc(u.sdate || '-') + '</span></div>' +
        '<div><span class="k">옵션계약일</span><span class="v">' + esc(u.odate || '-') + '</span></div>' +
        '</div>';
      if (cur.opts.length) {
        h += '<ul class="opt-list">' + cur.opts.map(function (o) {
          return '<li><span class="name">' + esc(o) + '</span></li>';
        }).join('') + '</ul>';
      } else {
        h += '<p class="empty-note">' + (cur.state === 'nooption'
          ? '옵션 계약은 완료됐지만 선택한 옵션 항목이 없습니다.'
          : '아직 옵션 계약이 진행되지 않았습니다.') + '</p>';
      }
      if (ed) {
        h += '<p class="empty-note" style="margin-top:12px;">✏️ ' + esc(ed.at) +
             (ed.who ? ' · ' + esc(ed.who) : '') + ' 수정됨</p>';
      }
      host.innerHTML = h;
    } else if (curTab === 'plan') {
      P.renderUnitPlan(host, u, '기본형');
    } else {
      U.renderContractEdit(host, u, OPTION_ITEMS, cur, function () {
        repaintAll();
        renderModal();
      });
    }
  }

  document.getElementById('closeBtn').addEventListener('click', function () {
    backdrop.classList.remove('open'); curKey = null;
  });
  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop) { backdrop.classList.remove('open'); curKey = null; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      backdrop.classList.remove('open');
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('pinBackdrop').classList.remove('open');
      curKey = null;
    }
  });

  /* ---------- 옵션별 골구도 PDF 출력 ---------- */
  function buildPrintHead() {
    var sel = view.activeOptions;
    if (!sel.length) return;
    var label = sel.join(' + ');
    var byDong = {}, hitCount = 0;
    document.querySelectorAll('.unit-cell.opt-hit').forEach(function (c) {
      if (c.style.display === 'none') return;
      var u = UNITS[c.dataset.key];
      if (!u) return;
      (byDong[u.dong] = byDong[u.dong] || []).push(u);
      hitCount++;
    });

    var t = new Date();
    var stamp = t.getFullYear() + '.' + String(t.getMonth() + 1).padStart(2, '0') + '.' + String(t.getDate()).padStart(2, '0');
    var filterLabel = view.stateFilter === 'all' ? '' :
      ' · 필터: ' + ({ option: '옵션 계약만', nooption: '계약완료·옵션無', none: '미계약만' }[view.stateFilter] || '');

    document.getElementById('printTitle').textContent = '청량리역 요진 와이시티 — ' + label + ' 대상 세대';
    document.getElementById('printMeta').textContent =
      '총 ' + hitCount + '세대' + filterLabel + ' · 골구도 기준 · 출력일 ' + stamp;

    var listHtml = '';
    ['101', '102'].forEach(function (dong) {
      var arr = byDong[dong];
      if (!arr || !arr.length) return;
      arr.sort(function (a, b) { return Number(a.ho) - Number(b.ho); });
      listHtml += '<div><b>' + dong + '동</b> (' + arr.length + ') ' +
        arr.map(function (u) { return u.label; }).join(', ') + '</div>';
    });
    if (!listHtml) listHtml = '<div>해당하는 세대가 없습니다.</div>';
    listHtml += '<div class="print-legend" style="margin-top:6px;">' +
      '<span class="box" style="background:#ffe9b0; border:1.6pt solid #000;"></span>' + label + ' 대상(전부)' +
      '<span class="box" style="background:#fff; border:1px solid #ddd;"></span>해당 없음</div>';
    document.getElementById('printList').innerHTML = listHtml;
  }

  pdfBtn.addEventListener('click', function () {
    if (!view.activeOptions.length) return;
    buildPrintHead();
    requestAnimationFrame(function () { setTimeout(function () { window.print(); }, 0); });
  });
  window.addEventListener('beforeprint', buildPrintHead);

  /* ---------- 시작 ---------- */
  buildGrid('grid101', '101');
  buildGrid('grid102', '102');
  paintStats();
  paintChips();

  U.initBar({
    store: S,
    kind: KIND,
    onChanged: repaintAll,
    onModeChange: function () { if (curKey) renderModal(); }
  });
})();
</script>
</body>
</html>
