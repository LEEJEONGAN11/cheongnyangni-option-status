
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 지시 확인 — 청량리역 요진 와이시티</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #ffffff;
    --page-plane: #f6f6f3;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --good: #0ca30c; --good-bg: #e3f6e3; --good-text: #0a6e0a;
    --info: #2a78d6; --info-bg: #e3edfb; --info-text: #1c5cab;
    --neutral-bg: #f0efec; --neutral-text: #6b6a65;
    --accent: #eda100; --accent-bg: #fdf0d6; --accent-text: #7a5200;
    --danger: #d6422a; --danger-bg: #fbe6e1; --danger-text: #a3301c;
    --brand: #6a4fd6; --brand-bg: #ece7fb; --brand-text: #4c35a8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page-plane); color: var(--text-primary); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

  #loginScreen { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .login-box { background: var(--surface-2); border:1px solid var(--border); border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 320px; text-align:center; box-shadow: 0 20px 45px rgba(0,0,0,.06); }
  .login-box h1 { font-size: 16px; margin: 0 0 4px; }
  .login-box p { font-size: 12px; color: var(--text-muted); margin: 0 0 18px; }
  .pin-display { font-size: 26px; font-weight: 800; letter-spacing: 10px; min-height: 34px; margin-bottom: 16px; }
  .pin-display.empty { color: var(--text-muted); font-size: 20px; letter-spacing: 2px; }
  .pin-pad { display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
  .pin-key { padding: 16px; border-radius: 10px; background: var(--page-plane); border:1px solid var(--gridline); font-weight:700; font-size:16px; cursor:pointer; user-select:none; }
  .pin-key:active { background: var(--gridline); }
  .pin-key.wide { font-size: 12px; color: var(--text-muted); }
  .login-error { color: var(--danger-text); font-size: 12.5px; min-height: 16px; margin-bottom: 4px; }
  .login-box button.confirm { width:100%; padding: 12px; border-radius: 10px; border:none; background: var(--brand); color:#fff; font-size: 14px; font-weight:800; cursor:pointer; margin-top: 4px; }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
  .topbar h1 { font-size: 16px; margin:0; }
  .topbar .sub { font-size: 11.5px; color: var(--text-muted); }
  .btn { padding: 8px 14px; border-radius: 9px; border:1px solid var(--border); background: var(--surface-2); font-size: 12.5px; font-weight:700; cursor:pointer; color: var(--text-primary); }

  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .chip { padding: 7px 13px; border-radius:999px; font-size:12px; border:1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor:pointer; }
  .chip.active { background: var(--text-primary); color:#fff; border-color: var(--text-primary); }

  .work-item { display:flex; gap:12px; align-items:center; background: var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; }
  .work-item .thumb { width:52px; height:52px; border-radius:8px; background: linear-gradient(135deg,#d9d6cd,#c7c3b6); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .work-item .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .work-item .info { flex:1; min-width:0; }
  .work-item .ho { font-size:13.5px; font-weight:800; }
  .work-item .task { font-size:12px; color: var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { display:inline-block; font-size:10px; font-weight:800; padding:4px 9px; border-radius:999px; margin-top:4px; }
  .empty-state { text-align:center; padding: 50px 20px; color: var(--text-muted); font-size:13px; }
  .loading-note { font-size:12.5px; color: var(--text-muted); text-align:center; padding: 30px; }

  .overlay { position:fixed; inset:0; background: rgba(11,11,11,.45); display:none; align-items:flex-start; justify-content:center; padding: 24px 12px; overflow-y:auto; z-index: 100; }
  .overlay.active { display:flex; }
  .modal { background: var(--surface-2); border-radius: 16px; width: 100%; max-width: 440px; padding: 22px; margin-top: 6px; position:relative; }
  .modal h2 { font-size: 15px; margin: 0 0 14px; }
  .close-x { position:absolute; top:14px; right:18px; cursor:pointer; color: var(--text-muted); font-size:18px; background:none; border:none; }
  .detail-row { font-size: 12.5px; margin-bottom: 8px; line-height:1.6; }
  .detail-row b { color: var(--text-secondary); }
  .req-photos { display:flex; gap:8px; overflow-x:auto; margin: 10px 0; }
  .req-photos img { width:100px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--gridline); flex-shrink:0; }
  .photo-failed {
    width:100px; height:100px; flex-shrink:0; display:flex; flex-direction:column; gap:4px;
    align-items:center; justify-content:center; text-align:center; padding:6px;
    font-size:10.5px; color:var(--text-muted); background: var(--page-plane);
    border:1px solid var(--gridline); border-radius:8px;
  }
  .photo-failed a { color: var(--info-text); }
  .photo-failed.sm { width:100%; height:100%; font-size:9px; gap:0; padding:2px; background:transparent; border:none; border-radius:0; }

  /* ---- 도면 위치 표시 ---- */
  .plan-box { position:relative; border:1px solid var(--gridline); border-radius:10px;
              overflow:hidden; background:var(--page-plane); margin:10px 0; }
  .plan-box img { display:block; width:100%; }
  .plan-pin { position:absolute; width:24px; height:24px; margin-left:-12px; margin-top:-24px; pointer-events:none; }
  .plan-pin .p-dot { width:24px; height:24px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
                     background:var(--danger); border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.35); }
  .plan-pin .p-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                     color:#fff; font-size:11px; font-weight:800; }
  .plan-none { padding:22px 14px; text-align:center; font-size:12px; color:var(--text-muted); line-height:1.7; }
  .plan-hint { font-size:11.5px; color:var(--text-muted); margin-top:2px; line-height:1.65; }

  .field { margin-bottom: 12px; }
  .field label { display:block; font-size: 11.5px; color: var(--text-muted); font-weight:700; margin-bottom:5px; }
  .field textarea { width:100%; padding: 9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13px; font-family:inherit; min-height:60px; background: var(--surface-1); }
  .dropzone { border:1.5px dashed var(--border); border-radius:10px; padding:16px; text-align:center; font-size:12px; color:var(--text-muted); cursor:pointer; background: var(--surface-1); }
  .dropzone input { display:none; }
  .photo-preview { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .photo-preview img { width: 52px; height:52px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
  .btn-primary { width:100%; padding:12px; border-radius:9px; font-size:13.5px; font-weight:800; border:none; cursor:pointer; background: var(--brand); color:#fff; margin-top: 10px; }
  .status-note { font-size:12.5px; padding:10px 12px; border-radius:9px; background: var(--accent-bg); color: var(--accent-text); margin-bottom:10px; }
  .status-note.good { background: var(--good-bg); color: var(--good-text); }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: var(--text-primary); color:#fff; padding:11px 20px; border-radius:999px; font-size:13px; z-index:200; display:none; max-width: 90vw; text-align:center; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>업체 작업 확인</h1>
    <p>청량리역 요진 와이시티 · 배정받은 PIN을 입력해주세요</p>
    <div class="pin-display" id="pinDisplay">••••</div>
    <div class="login-error" id="loginError"></div>
    <div class="pin-pad">
      <div class="pin-key" onclick="pinPress('1')">1</div><div class="pin-key" onclick="pinPress('2')">2</div><div class="pin-key" onclick="pinPress('3')">3</div>
      <div class="pin-key" onclick="pinPress('4')">4</div><div class="pin-key" onclick="pinPress('5')">5</div><div class="pin-key" onclick="pinPress('6')">6</div>
      <div class="pin-key" onclick="pinPress('7')">7</div><div class="pin-key" onclick="pinPress('8')">8</div><div class="pin-key" onclick="pinPress('9')">9</div>
      <div class="pin-key wide" onclick="pinClear()">지우기</div><div class="pin-key" onclick="pinPress('0')">0</div><div class="pin-key wide" onclick="pinBackspace()">←</div>
    </div>
    <button class="confirm" onclick="doLogin()">접속하기</button>
  </div>
</div>

<div class="wrap" id="mainScreen" style="display:none;">
  <div class="topbar">
    <div>
      <h1 id="companyTitle">업체 작업 목록</h1>
      <div class="sub">청량리역 요진 와이시티</div>
    </div>
    <button class="btn" onclick="logout()">로그아웃</button>
  </div>

  <div class="filters">
    <span class="chip active" data-status="__all" onclick="setFilter('__all')">전체</span>
    <span class="chip" data-status="진행중" onclick="setFilter('진행중')">진행중</span>
    <span class="chip" data-status="완료확인대기" onclick="setFilter('완료확인대기')">확인대기</span>
    <span class="chip" data-status="완료" onclick="setFilter('완료')">완료</span>
  </div>

  <div id="workList"></div>
  <div id="workEmpty" class="empty-state" style="display:none;">배정된 작업이 없습니다.</div>
  <div id="workLoading" class="loading-note">불러오는 중...</div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2 id="d_title"></h2>
    <div id="d_body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   설정 — 배포 후 이 값만 본인의 Apps Script 웹 앱 URL로 바꾸세요
   (admin.html과 반드시 같은 주소여야 합니다)
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbw7Mk6uFVOx_mgRSVO-wfLqy2zFqxQ9c-lNHBBlYA4aCgqQ9AR0YaaZmhaiYTE2d0r7/exec';

const STATUS_COLORS = {
  '등록됨': { bg: 'var(--neutral-bg)', text: 'var(--neutral-text)' },
  '진행중': { bg: 'var(--info-bg)', text: 'var(--info-text)' },
  '완료확인대기': { bg: 'var(--accent-bg)', text: 'var(--accent-text)' },
  '완료': { bg: 'var(--good-bg)', text: 'var(--good-text)' },
};

let pinValue = '';
let companyPin = '';
let companyName = '';
let myIssues = [];
let currentFilter = '__all';
let pendingReportPhotos = [];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  return fetch(API_URL + '?' + qs).then(r => r.json());
}
function apiPost(action, body) {
  return fetch(API_URL + '?action=' + encodeURIComponent(action), {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

/* ---------- pin pad ---------- */
const PIN_MAX = 8;

function pinPress(d) {
  if (pinValue.length >= PIN_MAX) {
    document.getElementById('loginError').textContent = '"지우기"를 누르고 다시 입력해주세요.';
    return;
  }
  document.getElementById('loginError').textContent = '';
  pinValue += d;
  renderPin();
}
function pinBackspace() {
  pinValue = pinValue.slice(0, -1);
  document.getElementById('loginError').textContent = '';
  renderPin();
}
function pinClear() {
  pinValue = '';
  document.getElementById('loginError').textContent = '';
  renderPin();
}
function renderPin() {
  const el = document.getElementById('pinDisplay');
  // 입력한 자릿수만큼만 점을 찍습니다. (비어 있는데 ●●●● 로 보이면 헷갈립니다)
  if (!pinValue) { el.textContent = '– – – –'; el.classList.add('empty'); }
  else { el.textContent = pinValue.replace(/./g, '•'); el.classList.remove('empty'); }
}

let autoLoginTry = false;

/* 로그인 실패 시에는 입력을 반드시 비웁니다.
   안 비우면 다음에 누르는 숫자가 뒤에 붙어서 "PIN이 안 먹는" 것처럼 보입니다. */
function failLogin(msg) {
  localStorage.removeItem('as_contractor_pin');
  pinValue = '';
  renderPin();
  document.getElementById('loginError').textContent = autoLoginTry ? '' : (msg || '');
  autoLoginTry = false;
}

function doLogin() {
  if (!pinValue) return;
  document.getElementById('loginError').textContent = '';
  apiGet({ action: 'listIssues', pin: pinValue }).then(res => {
    if (!res.ok) {
      failLogin(res.error || 'PIN이 올바르지 않습니다.');
      return;
    }
    companyPin = pinValue;
    companyName = res.companyName;
    localStorage.setItem('as_contractor_pin', companyPin);
    autoLoginTry = false;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('companyTitle').textContent = companyName + ' · 작업 목록';
    myIssues = res.issues;
    renderList();
  }).catch(() => {
    failLogin('접속에 실패했습니다. 잠시 후 다시 시도해주세요.');
  });
}

function logout() {
  localStorage.removeItem('as_contractor_pin');
  location.reload();
}

function tryAutoLogin() {
  const saved = localStorage.getItem('as_contractor_pin');
  if (saved) { autoLoginTry = true; pinValue = saved; renderPin(); doLogin(); }
  else { renderPin(); }
}

function loadMine() {
  document.getElementById('workLoading').style.display = 'block';
  apiGet({ action: 'listIssues', pin: companyPin }).then(res => {
    document.getElementById('workLoading').style.display = 'none';
    if (!res.ok) { toast(res.error || '불러오기 실패'); return; }
    myIssues = res.issues;
    renderList();
  }).catch(() => {
    document.getElementById('workLoading').style.display = 'none';
    toast('API 연결에 실패했습니다.');
  });
}

function setFilter(status) {
  currentFilter = status;
  document.querySelectorAll('.chip[data-status]').forEach(c => c.classList.toggle('active', c.dataset.status === status));
  renderList();
}

function renderList() {
  let list = myIssues;
  if (currentFilter !== '__all') list = list.filter(i => i.상태 === currentFilter);
  const container = document.getElementById('workList');
  document.getElementById('workEmpty').style.display = list.length ? 'none' : 'block';
  container.innerHTML = list.map(issue => {
    const c = STATUS_COLORS[issue.상태] || STATUS_COLORS['진행중'];
    const thumb = firstPhoto(issue.요청사진);
    return `
      <div class="work-item" onclick="openDetail('${escapeAttr(issue.issue_id)}')">
        <div class="thumb">${thumb ? photoImgHtml(thumb, true) : ''}</div>
        <div class="info">
          <div class="ho">${unitLabel(issue)}</div>
          <div class="task">${escapeHtml(issue.카테고리 || '')} · ${escapeHtml(issue.지시사항 || issue.문제설명 || '')}</div>
          <span class="badge" style="background:${c.bg}; color:${c.text};">${escapeHtml(issue.상태)}</span>
        </div>
      </div>
    `;
  }).join('');
  wirePhotoFallbacks(container);
}

function firstPhoto(csv) {
  if (!csv) return '';
  return String(csv).split(',').filter(Boolean)[0] || '';
}

/* "101" + "1034" -> "101동 1034호" (이미 동/호가 붙어 있으면 그대로 둡니다) */
function unitLabel(issue) {
  const d = String(issue.동 || '').trim();
  const h = String(issue.호수 || '').trim();
  const dl = d ? (d.endsWith('동') ? d : d + '동') : '';
  const hl = h ? (h.endsWith('호') ? h : h + '호') : '';
  return escapeHtml((dl + ' ' + hl).trim() || '-');
}

function openDetail(issueId) {
  const issue = myIssues.find(i => i.issue_id === issueId);
  if (!issue) return;
  document.getElementById('d_title').innerHTML = unitLabel(issue) + ' · ' + escapeHtml(issue.issue_id);
  pendingReportPhotos = [];

  const reqPhotos = String(issue.요청사진 || '').split(',').filter(Boolean);

  let html = `
    <div class="detail-row"><b>카테고리:</b> ${escapeHtml(issue.카테고리||'-')} · <b>우선순위:</b> ${escapeHtml(issue.우선순위||'-')}</div>
    <div class="detail-row"><b>문제설명:</b> ${escapeHtml(issue.문제설명||'-')}</div>
    ${reqPhotos.length ? `<div class="req-photos">${reqPhotos.map(u => photoImgHtml(u)).join('')}</div>` : ''}
    <div class="detail-row"><b>작업 지시사항:</b> ${escapeHtml(issue.지시사항||'-')}</div>
    <div class="detail-row"><b>희망완료일:</b> ${escapeHtml(issue.희망완료일||'-')}</div>
    <div id="c_planHost"></div>
  `;

  if (issue.상태 === '완료확인대기') {
    html += `<div class="status-note">완료 보고를 제출했고, 관리팀 확인을 기다리는 중입니다.</div>`;
  } else if (issue.상태 === '완료') {
    html += `<div class="status-note good">완료 승인되었습니다. 확인해주셔서 감사합니다.</div>`;
  } else {
    // 진행중 (반려 포함) → 완료 보고 폼
    if (issue.반려사유) {
      html += `<div class="status-note" style="background:var(--danger-bg); color:var(--danger-text);"><b>반려 사유:</b> ${escapeHtml(issue.반려사유)} — 재작업 후 다시 보고해주세요.</div>`;
    }
    html += `
      <div class="field">
        <label>완료 사진 (필수)</label>
        <div class="dropzone" onclick="document.getElementById('r_photos').click()">📷 눌러서 완료 사진 선택</div>
        <input type="file" id="r_photos" accept="image/*" multiple onchange="handlePhotoSelect(this)">
        <div class="photo-preview" id="reportPreview"></div>
      </div>
      <div class="field"><label>작업 메모</label><textarea id="r_memo" placeholder="어떻게 처리했는지 남겨주세요"></textarea></div>
      <button class="btn-primary" onclick="submitReport('${escapeAttr(issue.issue_id)}')">완료 보고 제출</button>
    `;
  }

  const body = document.getElementById('d_body');
  body.innerHTML = html;
  wirePhotoFallbacks(body);

  // 관리팀이 도면에 찍어준 위치를 그대로 보여줍니다 (수정은 불가)
  const planHost = document.getElementById('c_planHost');
  const saved = parseLoc(issue.위치);
  if (saved && saved.pts.length) {
    planHost.innerHTML = '<div class="detail-row" style="margin-top:10px;"><b>작업 위치</b></div>' +
      '<div id="c_planInner"></div>' +
      '<div class="plan-hint">빨간 표시가 관리팀이 지정한 지점입니다 (' + saved.pts.length + '곳).</div>';
    renderPlan(document.getElementById('c_planInner'),
      { type: saved.type, variant: saved.variant, pts: saved.pts }, false);
  } else {
    planHost.innerHTML = '';
  }

  document.getElementById('detailOverlay').classList.add('active');
}

function closeModal() { document.getElementById('detailOverlay').classList.remove('active'); }

function handlePhotoSelect(input) {
  const files = Array.from(input.files || []);
  const preview = document.getElementById('reportPreview');
  files.forEach(file => {
    compressImage(file).then(compressed => {
      pendingReportPhotos.push(compressed);
      const img = document.createElement('img');
      img.src = 'data:' + compressed.mimeType + ';base64,' + compressed.data;
      preview.appendChild(img);
    });
  });
}

function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1600;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg', name: file.name });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

var PLAN_DIR = 'images/';                      // 평면도 폴더가 다르면 이 줄만 바꾸세요
var PLAN_EXTS = ['jpg', 'jpeg', 'png', 'webp'];
var PLAN_DEFAULT_VARIANT = '확장형';   // 도면은 확장형 기준
var planSrcCache = {};

function normDong(v) { return String(v == null ? '' : v).replace(/동\s*$/, '').trim(); }
function normHo(v)   { return String(v == null ? '' : v).replace(/호\s*$/, '').trim(); }

/** 동/호수로 타입을 찾습니다. 못 찾으면 null */
function lookupUnit(dong, ho) {
  var d = UNIT_TYPES[normDong(dong)];
  if (!d) return null;
  return d[normHo(ho)] || null;
}

/** 해당 타입/변형의 평면도 파일이 실제로 있는지 확장자를 바꿔가며 확인 */
function planProbe(type, variant) {
  var key = type + '|' + variant;
  if (Object.prototype.hasOwnProperty.call(planSrcCache, key)) {
    return Promise.resolve(planSrcCache[key]);
  }
  return new Promise(function (resolve) {
    var i = 0;
    (function next() {
      if (i >= PLAN_EXTS.length) { planSrcCache[key] = null; resolve(null); return; }
      var src = PLAN_DIR + encodeURIComponent(type + '_' + variant) + '.' + PLAN_EXTS[i++];
      var img = new Image();
      img.onload = function () { planSrcCache[key] = src; resolve(src); };
      img.onerror = next;
      img.src = src;
    })();
  });
}

function parseLoc(s) {
  if (!s) return null;
  var p = String(s).split('|');
  if (p.length < 3) return null;
  var pts = [];
  p[2].split(';').forEach(function (seg) {
    if (!seg) return;
    var xy = seg.split(',');
    var x = parseFloat(xy[0]), y = parseFloat(xy[1]);
    if (isFinite(x) && isFinite(y)) pts.push({ x: x, y: y });
  });
  return { type: p[0], variant: p[1] || '기본형', pts: pts };
}

function buildLoc(type, variant, pts) {
  if (!type || !pts || !pts.length) return '';
  return type + '|' + variant + '|' + pts.map(function (p) {
    return p.x.toFixed(3) + ',' + p.y.toFixed(3);
  }).join(';');
}

function pinsHtml(pts) {
  return pts.map(function (p, i) {
    return '<div class="plan-pin" style="left:' + (p.x * 100) + '%; top:' + (p.y * 100) + '%;">' +
           '<div class="p-dot"></div><div class="p-num">' + (i + 1) + '</div></div>';
  }).join('');
}

/**
 * 평면도를 그립니다.
 *  host     : 그려 넣을 요소
 *  state    : { type, variant, pts }  — pickable이면 이 객체를 직접 고칩니다
 *  pickable : true면 눌러서 핀을 찍을 수 있음
 *  onChange : 핀이 바뀔 때 호출
 */
function renderPlan(host, state, pickable, onChange) {
  if (!host) return;
  if (!state || !state.type) {
    host.innerHTML = '<div class="plan-box"><div class="plan-none">' +
      '도면을 찾을 수 없는 호수입니다.<br>동·호수를 정확히 고르면 평면도가 나타납니다.</div></div>';
    return;
  }
  host.innerHTML = '<div class="plan-box"><div class="plan-none">평면도 불러오는 중…</div></div>';

  // 도면은 확장형 기준으로 보여줍니다.
  // 오피스텔처럼 확장형 도면이 없는 타입은 자동으로 기본형으로 대체합니다.
  planProbe(state.type, state.variant).then(function (src) {
    if (!src && state.variant !== '기본형') {
      state.variant = '기본형';
      return planProbe(state.type, '기본형');
    }
    return src;
  }).then(function (src) {
    if (!src) {
      host.innerHTML = '<div class="plan-box"><div class="plan-none">' +
        '<b>' + escapeHtml(state.type) + '</b> 타입 평면도가 아직 없습니다.<br>' +
        'images 폴더에 <b>' + escapeHtml(state.type) + '_기본형.jpg</b> 로 올리면 바로 표시됩니다.' +
        '</div></div>';
      return;
    }
    var html = '<div class="plan-box' + (pickable ? ' pickable' : '') + '" data-plan="1">' +
               '<img src="' + escapeAttr(src) + '" alt="평면도">' + pinsHtml(state.pts) + '</div>';
    if (pickable) {
      html += '<div class="plan-tools">' +
              '<button type="button" class="vbtn ghost" data-plan-undo="1">되돌리기</button>' +
              '<button type="button" class="vbtn ghost" data-plan-clear="1">모두 지우기</button>' +
              '</div>' +
              '<div class="plan-hint">도면에서 문제가 있는 지점을 눌러주세요. 여러 곳을 찍어도 됩니다. ' +
              '현재 <b>' + state.pts.length + '곳</b> 표시됨.' +
              (state.variant !== '확장형'
                ? '<br>이 타입은 확장형 도면이 없어 <b>기본형</b>으로 표시했습니다.' : '') +
              '</div>';
    }
    host.innerHTML = html;

    if (!pickable) return;
    var box = host.querySelector('.plan-box');
    box.addEventListener('click', function (e) {
      var r = box.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width;
      var y = (e.clientY - r.top) / r.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      state.pts.push({ x: x, y: y });
      renderPlan(host, state, true, onChange);
      if (onChange) onChange(state);
    });
    var undo = host.querySelector('[data-plan-undo]');
    if (undo) undo.addEventListener('click', function () {
      state.pts.pop();
      renderPlan(host, state, true, onChange);
      if (onChange) onChange(state);
    });
    var clr = host.querySelector('[data-plan-clear]');
    if (clr) clr.addEventListener('click', function () {
      state.pts = [];
      renderPlan(host, state, true, onChange);
      if (onChange) onChange(state);
    });
  });
}

/* ---------- 사진 표시 (구글 드라이브 링크 우회 포함) ---------- */
/* 구글 드라이브는 이미지 직접 링크를 자주 막기 때문에, 순서대로 3가지를 시도합니다.
   1) drive.google.com/thumbnail  2) lh3.googleusercontent.com  3) API가 직접 읽어서 전달 */
function photoIdFrom(url) {
  const s = String(url || '');
  const m = s.match(/[?&]id=([\w-]{10,})/) || s.match(/\/d\/([\w-]{10,})/);
  return m ? m[1] : '';
}

function photoImgHtml(url, compact) {
  const id = photoIdFrom(url);
  return `<img data-photo-id="${escapeAttr(id)}"${compact ? ' data-compact="1"' : ''}` +
         ` src="${escapeAttr(url)}" loading="lazy" alt="사진">`;
}

function markPhotoFailed(img) {
  const id = img.dataset.photoId;
  const compact = img.dataset.compact === '1';
  const box = document.createElement('div');
  box.className = compact ? 'photo-failed sm' : 'photo-failed';
  box.innerHTML = compact ? '' :
    '사진을 불러오지 못했어요' +
    (id ? `<a href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view" target="_blank" rel="noopener">드라이브에서 열기</a>` : '');
  if (img.parentNode) img.parentNode.replaceChild(box, img);
}

// 같은 사진을 두 번 받아오지 않도록 캐시합니다 (목록 썸네일 + 상세 사진)
const photoCache = new Map();       // "id|thumb" -> dataUrl
let drivePhotosBlocked = false;     // 드라이브 직접 링크가 막힌 환경인지 한 번 확인되면 이후엔 바로 API 사용

// 받아온 썸네일은 브라우저에도 저장해둡니다. 다음 방문 때 바로 뜨게 하려고요.
const PHOTO_LS_KEY = 'as_photo_cache_v1';
const PHOTO_LS_MAX = 60;
let photoSaveTimer = null;

function loadPhotoCacheFromStorage() {
  try {
    const raw = localStorage.getItem(PHOTO_LS_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    Object.keys(obj).forEach(k => photoCache.set(k, obj[k]));
  } catch (e) {}
}

function savePhotoCacheSoon() {
  clearTimeout(photoSaveTimer);
  photoSaveTimer = setTimeout(() => {
    try {
      // 용량이 작은 목록 썸네일만 저장합니다 (원본은 저장 안 함)
      const entries = [...photoCache.entries()].filter(([k]) => k.endsWith('|1')).slice(-PHOTO_LS_MAX);
      localStorage.setItem(PHOTO_LS_KEY, JSON.stringify(Object.fromEntries(entries)));
    } catch (e) {
      try { localStorage.removeItem(PHOTO_LS_KEY); } catch (e2) {}
    }
  }, 800);
}
loadPhotoCacheFromStorage();

function fetchPhotoViaApi(id, thumb) {
  const cacheKey = id + '|' + (thumb ? '1' : '0');
  if (photoCache.has(cacheKey)) return Promise.resolve(photoCache.get(cacheKey));
  const params = { action: 'getPhoto', id, pin: companyPin };
  if (thumb) params.thumb = '1';
  return apiGet(params).then(res => {
    const url = (res && res.ok && res.dataUrl) ? res.dataUrl : null;
    if (url) { photoCache.set(cacheKey, url); savePhotoCacheSoon(); }
    return url;
  }).catch(() => null);
}

function loadViaApi(img, id, thumb) {
  fetchPhotoViaApi(id, thumb).then(url => {
    if (url) img.src = url;
    else markPhotoFailed(img);
  });
}

function wirePhotoFallbacks(root) {
  root.querySelectorAll('img[data-photo-id]').forEach(img => {
    if (img.dataset.wired === '1') return;
    img.dataset.wired = '1';
    const id = img.dataset.photoId;
    const thumb = img.dataset.compact === '1';
    const cacheKey = id + '|' + (thumb ? '1' : '0');

    if (id && photoCache.has(cacheKey)) { img.src = photoCache.get(cacheKey); return; }
    // 드라이브 직접 링크가 막힌 게 이미 확인됐으면 헛되이 두 번 실패하지 않고 바로 API로
    if (id && drivePhotosBlocked) { loadViaApi(img, id, thumb); return; }

    let stage = 0;
    img.addEventListener('error', () => {
      if (!id) { markPhotoFailed(img); return; }
      stage++;
      if (stage === 1) {
        img.src = 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w1600';
      } else if (stage === 2) {
        drivePhotosBlocked = true;
        loadViaApi(img, id, thumb);
      } else {
        markPhotoFailed(img);
      }
    });
  });
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }
